    <section class="about sec">
      <div class="wrap about__grid">
        <div class="about__text">
          <p class="eyebrow" data-rise>الشركة</p>
          <h2 class="h2" data-words>{{DISPLAY}}</h2>
          <p class="about__lead" data-rise>{{ABOUT1}}</p>
          <p class="about__p" data-rise>{{ABOUT2}}</p>
        </div>
        <figure class="frame" data-frame>

      <div class="wrap leader__grid">

          <p class="leader__bio" data-rise>{{LEADER_BIO}}</p>

        <ul class="stones" data-stones aria-label="الصفات المهنية">{{CREDENTIALS}}</ul>

    <section class="svcs sec">

        <header class="shead">
          <p class="eyebrow" data-rise>الخدمات</p>
          <h2 class="h2" data-words>{{SERVICES_TITLE}}</h2>

        <div class="colonnade" data-colonnade>
          {{COLONNADE}}
        </div>
      </div>
