server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    # خلف Traefik يصل الطلب إلى nginx عبر http، فيبني تحويلا مطلقا على http
    # فتزيد قفزة لكل تحويل. التحويل النسبي يحفظ بروتوكول الزائر.
    absolute_redirect off;

    # ترويسات الأمان في ملف مستقل، لأن add_header داخل أي location يلغي الموروث من server
    include /etc/nginx/snippets/security.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;

    # لا صفحة دخول محلية: بوابة العملاء والموظفين هي صفحة دخول المكتب في الرائد
    location = /login { return 301 https://alyabislaw.alraedlaw.com/login; }
    location = /admin { return 301 https://alyabislaw.alraedlaw.com/login; }

    # روابط الموقع الحالي (صفحة واحدة بأقسام)
    location = /index.html { return 301 /; }

    location ~* \.(webp|png|jpe?g|svg|ico|woff2?)$ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(css|js|json)$ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
